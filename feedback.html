<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Bug Report — AI Prompt Studio</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MV1SEZRYY6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MV1SEZRYY6');
    </script>
    <script src="js/common.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f8fafc;
            --subtext: #94a3b8;
        }

        [data-theme="cyberpunk"] {
            --bg-color: #180b28; --card-bg: #2d124d; --accent: #d946ef; --accent-hover: #c026d3;
        }
        [data-theme="emerald"] {
            --bg-color: #06231c; --card-bg: #0b3c30; --accent: #10b981; --accent-hover: #059669;
        }
        [data-theme="oled"] {
            --bg-color: #000000; --card-bg: #121212; --accent: #38bdf8; --accent-hover: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 720px; margin: 0 auto; }

        .nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 10px 16px; border-radius: 8px;
            margin-bottom: 24px; border: 1px solid #334155; flex-wrap: wrap; gap: 8px;
        }
        .nav-btn {
            background: #334155; color: #f8fafc; border: none; padding: 6px 14px;
            border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer;
            text-decoration: none; transition: 0.2s;
        }
        .nav-btn:hover { background: var(--accent); color: white; }

        header { text-align: center; margin-bottom: 28px; }
        header h1 { color: var(--accent); font-size: 24px; margin-bottom: 6px; }
        header p { color: var(--subtext); font-size: 13px; }

        .card {
            background: var(--card-bg); padding: 24px; border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .section-title {
            font-size: 14px; font-weight: 700; margin-bottom: 10px;
            display: flex; align-items: center; gap: 6px;
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            font-size: 12px; color: var(--subtext); margin-bottom: 5px;
            display: block; font-weight: 600;
        }
        .form-input, .form-textarea, .form-select {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            background: #0f172a; border: 1px solid #334155;
            color: var(--text); font-size: 13px; font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }
        .form-textarea { resize: vertical; min-height: 100px; line-height: 1.6; }

        /* Rating Stars */
        .rating-group { display: flex; gap: 6px; margin-top: 4px; }
        .star-btn {
            background: none; border: none; font-size: 26px; cursor: pointer;
            filter: grayscale(1) opacity(0.4); transition: 0.2s;
            padding: 2px;
        }
        .star-btn.active { filter: none; transform: scale(1.15); }
        .star-btn:hover { filter: none; transform: scale(1.2); }

        /* Category Pills */
        .category-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .cat-pill {
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
            cursor: pointer; border: 1.5px solid #475569; background: transparent;
            color: var(--subtext); transition: 0.2s;
        }
        .cat-pill:hover { border-color: var(--accent); color: var(--text); }
        .cat-pill.active { background: var(--accent); border-color: var(--accent); color: white; }

        /* Submit Button */
        .submit-btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white; transition: 0.3s; letter-spacing: 0.3px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
        }
        .submit-btn:active { transform: translateY(0); }

        /* Feedback History */
        .history-item {
            background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
            padding: 12px; margin-bottom: 10px; font-size: 12px; position: relative;
        }
        .history-item .hi-cat {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 10px; font-weight: 700; margin-right: 6px;
        }
        .hi-cat.bug { background: #ef44441a; color: #f87171; }
        .hi-cat.feature { background: #3b82f61a; color: #60a5fa; }
        .hi-cat.improve { background: #f59e0b1a; color: #fbbf24; }
        .hi-cat.other { background: #6366f11a; color: #a5b4fc; }
        .history-item .hi-date { color: #64748b; font-size: 10px; float: right; }
        .history-item .hi-msg { color: #cbd5e1; margin-top: 6px; line-height: 1.5; }
        .history-item .hi-stars { margin-top: 4px; font-size: 14px; }
        .hi-delete {
            position: absolute; top: 8px; right: 8px; background: none; border: none;
            color: #475569; cursor: pointer; font-size: 14px; padding: 2px 4px;
        }
        .hi-delete:hover { color: #ef4444; }

        .empty-state {
            text-align: center; padding: 30px; color: #475569; font-size: 13px;
        }

        .success-toast {
            display: none; position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%); background: #059669;
            color: white; padding: 12px 24px; border-radius: 10px;
            font-size: 13px; font-weight: 600; z-index: 9999;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { opacity: 0; top: 0; } to { opacity: 1; top: 20px; } }

        .theme-btns { display: flex; gap: 4px; }
        .api-btn {
            background: #334155; color: #f8fafc; border: none; padding: 4px 8px;
            border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.2s;
        }

        @media (max-width: 600px) {
            .nav-bar { justify-content: center; text-align: center; }
            header h1 { font-size: 20px; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>

<div id="success-toast" class="success-toast">✅ Feedback saved! Shukriya!</div>

<div class="container">
    <div class="nav-bar">
        <a href="index.html" class="nav-btn">🎨 Image Studio</a>
        <a href="video.html" class="nav-btn" style="background:#ec4899; color:white;">🎬 Video Studio</a>
        <div style="font-weight:bold; font-size:13px; color:var(--accent);">💬 Feedback</div>
        <div class="theme-btns">
            <button class="api-btn" onclick="changeAppTheme('default')">🌙</button>
            <button class="api-btn" onclick="changeAppTheme('cyberpunk')" style="background:#a855f7;">🟣</button>
            <button class="api-btn" onclick="changeAppTheme('emerald')" style="background:#10b981;">🟢</button>
            <button class="api-btn" onclick="changeAppTheme('oled')" style="background:#334155;">🖤</button>
        </div>
    </div>

    <header>
        <h1>💬 Feedback & Bug Report</h1>
        <p>Aapka feedback humein tool behtar banane mein madad karta hai — Hindi/Hinglish/English mein likhein!</p>
    </header>

    <!-- Feedback Form -->
    <div class="card">
        <div class="section-title">📝 Apna Feedback Dein</div>

        <div class="form-group">
            <label class="form-label">Aapka Naam (Optional)</label>
            <input type="text" id="fb-name" class="form-input" placeholder="e.g. Ramesh Kumar">
        </div>

        <div class="form-group">
            <label class="form-label">Email (Optional — agar reply chahiye to)</label>
            <input type="email" id="fb-email" class="form-input" placeholder="e.g. ramesh@gmail.com">
        </div>

        <div class="form-group">
            <label class="form-label">Feedback Category</label>
            <div class="category-group" id="fb-category">
                <button class="cat-pill active" data-cat="bug" onclick="selectCat(this)">🐛 Bug / Error</button>
                <button class="cat-pill" data-cat="feature" onclick="selectCat(this)">💡 New Feature Request</button>
                <button class="cat-pill" data-cat="improve" onclick="selectCat(this)">⚡ Improvement</button>
                <button class="cat-pill" data-cat="other" onclick="selectCat(this)">💬 General / Other</button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Kaun sa page mein issue hua? (Optional)</label>
            <select id="fb-page" class="form-select">
                <option value="">— Select Page —</option>
                <option value="Image Studio (index.html)">🎨 Image Prompt Studio</option>
                <option value="Video Studio (video.html)">🎬 Video Motion Studio</option>
                <option value="Admin Panel (admin.html)">⚙️ Admin Panel</option>
                <option value="Feedback Page">💬 Feedback Page</option>
                <option value="General / All Pages">🌐 General / All Pages</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Apna Feedback / Issue Detail Likhein *</label>
            <textarea id="fb-message" class="form-textarea" placeholder="Yahan apna feedback, bug detail, ya suggestion likhein... Hindi, Hinglish ya English mein!"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Overall Experience Rating</label>
            <div class="rating-group" id="fb-rating">
                <button class="star-btn" data-star="1" onclick="setRating(1)">⭐</button>
                <button class="star-btn" data-star="2" onclick="setRating(2)">⭐</button>
                <button class="star-btn" data-star="3" onclick="setRating(3)">⭐</button>
                <button class="star-btn" data-star="4" onclick="setRating(4)">⭐</button>
                <button class="star-btn" data-star="5" onclick="setRating(5)">⭐</button>
            </div>
        </div>

        <button class="submit-btn" onclick="submitFeedback()">📨 Submit Feedback</button>
    </div>

    <!-- Feedback History -->
    <div class="card">
        <div class="section-title" style="justify-content:space-between;">
            <span>📜 Aapke Submitted Feedbacks</span>
            <span style="font-size:11px; color:var(--subtext); font-weight:400;" id="fb-count"></span>
        </div>
        <div id="fb-history"></div>
    </div>
</div>

<script>
    let currentRating = 0;

    function setRating(n) {
        currentRating = n;
        document.querySelectorAll('#fb-rating .star-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i < n);
        });
    }

    function selectCat(el) {
        document.querySelectorAll('#fb-category .cat-pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
    }

    function getSelectedCategory() {
        const active = document.querySelector('#fb-category .cat-pill.active');
        return active ? active.getAttribute('data-cat') : 'other';
    }

    function getCatLabel(cat) {
        const map = { bug: '🐛 Bug', feature: '💡 Feature', improve: '⚡ Improve', other: '💬 Other' };
        return map[cat] || cat;
    }

    function submitFeedback() {
        const name    = document.getElementById('fb-name').value.trim();
        const email   = document.getElementById('fb-email').value.trim();
        const message = document.getElementById('fb-message').value.trim();
        const page    = document.getElementById('fb-page').value;
        const category = getSelectedCategory();

        if (!message) {
            alert("Kripya feedback message zaroor likhein!");
            document.getElementById('fb-message').focus();
            return;
        }

        const feedback = {
            id: Date.now(),
            name: name || 'Anonymous User',
            email: email || '',
            message: message,
            page: page || 'Not specified',
            category: category,
            rating: currentRating,
            date: new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })
        };

        // Save to localStorage
        const feedbacks = JSON.parse(localStorage.getItem('APP_FEEDBACKS') || '[]');
        feedbacks.unshift(feedback);
        localStorage.setItem('APP_FEEDBACKS', JSON.stringify(feedbacks));

        // Build mailto link for developer notification
        const subject = encodeURIComponent(`[AI Studio Feedback] ${getCatLabel(category)} - ${feedback.name}`);
        const body = encodeURIComponent(
            `Feedback from: ${feedback.name}\n` +
            `Email: ${feedback.email || 'N/A'}\n` +
            `Page: ${feedback.page}\n` +
            `Category: ${getCatLabel(category)}\n` +
            `Rating: ${'⭐'.repeat(currentRating) || 'Not rated'}\n` +
            `Date: ${feedback.date}\n\n` +
            `Message:\n${feedback.message}`
        );

        // Show success
        const toast = document.getElementById('success-toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);

        // Clear form
        document.getElementById('fb-name').value = '';
        document.getElementById('fb-email').value = '';
        document.getElementById('fb-message').value = '';
        document.getElementById('fb-page').selectedIndex = 0;
        setRating(0);
        selectCat(document.querySelector('#fb-category .cat-pill[data-cat="bug"]'));

        // Render updated history
        renderHistory();

        // Optionally open mailto (user can choose to send email)
        const sendEmail = confirm("✅ Feedback saved!\n\nKya aap developer ko email bhi bhejna chahenge?\n(Gmail / Outlook open hoga)");
        if (sendEmail) {
            window.open(`mailto:rockyhandso@gmail.com?subject=${subject}&body=${body}`, '_blank');
        }
    }

    function renderHistory() {
        const feedbacks = JSON.parse(localStorage.getItem('APP_FEEDBACKS') || '[]');
        const container = document.getElementById('fb-history');
        const countEl = document.getElementById('fb-count');

        countEl.textContent = feedbacks.length > 0 ? `(${feedbacks.length} feedback${feedbacks.length > 1 ? 's' : ''})` : '';

        if (feedbacks.length === 0) {
            container.innerHTML = '<div class="empty-state">📭 Abhi tak koi feedback submit nahi hua.<br>Upar form bharna shuru karein!</div>';
            return;
        }

        container.innerHTML = feedbacks.map(fb => `
            <div class="history-item">
                <button class="hi-delete" onclick="deleteFeedback(${fb.id})" title="Delete">✕</button>
                <span class="hi-cat ${fb.category}">${getCatLabel(fb.category)}</span>
                <span class="hi-date">${fb.date}</span>
                <div class="hi-msg">${escapeHtml(fb.message)}</div>
                ${fb.rating ? `<div class="hi-stars">${'⭐'.repeat(fb.rating)}</div>` : ''}
                <div style="font-size:10px; color:#475569; margin-top:4px;">
                    ${escapeHtml(fb.name)} ${fb.page !== 'Not specified' ? '• ' + escapeHtml(fb.page) : ''}
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function deleteFeedback(id) {
        if (!confirm("Kya aap ye feedback delete karna chahte hain?")) return;
        let feedbacks = JSON.parse(localStorage.getItem('APP_FEEDBACKS') || '[]');
        feedbacks = feedbacks.filter(fb => fb.id !== id);
        localStorage.setItem('APP_FEEDBACKS', JSON.stringify(feedbacks));
        renderHistory();
    }

    // Init
    renderHistory();

    // Auto-prefill from API error banner
    (function checkPrefill() {
        try {
            const raw = sessionStorage.getItem('FEEDBACK_PREFILL');
            if (!raw) return;
            const prefill = JSON.parse(raw);
            sessionStorage.removeItem('FEEDBACK_PREFILL');

            // Set category
            if (prefill.autoCategory) {
                const pill = document.querySelector(`#fb-category .cat-pill[data-cat="${prefill.autoCategory}"]`);
                if (pill) selectCat(pill);
            }
            // Set page
            if (prefill.autoPage) {
                const sel = document.getElementById('fb-page');
                for (let i = 0; i < sel.options.length; i++) {
                    if (sel.options[i].value.includes(prefill.autoPage.split('(')[0].trim())) {
                        sel.selectedIndex = i; break;
                    }
                }
            }
            // Set message
            if (prefill.autoMessage) {
                document.getElementById('fb-message').value = prefill.autoMessage;
            }

            // Highlight the form
            const card = document.querySelector('.card');
            if (card) {
                card.style.border = '1.5px solid #f59e0b';
                card.style.boxShadow = '0 0 20px rgba(245,158,11,0.15)';
                setTimeout(() => { card.style.border = ''; card.style.boxShadow = ''; }, 4000);
            }
        } catch(e) {}
    })();
</script>

</body>
</html>
